<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">

<title>Taller de codiseño</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #1E2F42; --teal: #00718A; --verde: #1CE56D; --magenta: #FF0068; --amarillo: #F5C542;
    --crema: #F3F8E8; --blanco: #FFFFFF; --gris: #5A6472; --linea: #D9DDE3; --texto: #3A4A5C; --suave: #E6F1F3;
    --font: "Century Gothic", "Questrial", "Didact Gothic", Verdana, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: var(--font); color: var(--azul); font-size: 16px; min-height: 100vh;
         background: linear-gradient(180deg, var(--azul) 0%, var(--teal) 100%) fixed; }
  button, select, input, textarea { font: inherit; }
  :focus-visible { outline: 3px solid var(--verde); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .logos { background: var(--blanco); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .logos img { display: block; height: 48px; width: auto; max-width: 46%; object-fit: contain; }

  .avance { position: sticky; top: 0; z-index: 5; background: var(--azul); padding: 10px 16px 12px; color: var(--blanco); }

  main { max-width: 640px; margin: 0 auto; padding: 18px 16px 120px; display: flex; flex-direction: column; gap: 14px; }
  main.ancho { max-width: 1120px; }
  .modulo-cab { color: var(--blanco); display: flex; gap: 14px; align-items: flex-start; padding: 6px 2px 4px; }
  .modulo-cab .ico { flex: none; width: 52px; height: 52px; border-radius: 14px; background: rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center; }
  .modulo-cab .eyebrow { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--verde); }
  .modulo-cab h1 { font-size: 24px; line-height: 1.2; margin: 4px 0 4px; }

  .tarjeta h2 { font-size: 18px; margin: 0; }

  .lista-inst li { display: grid; grid-template-columns: 30px 1fr; gap: 8px; font-size: 16px; line-height: 1.4; }
  .lista-inst .em { font-size: 22px; line-height: 1.1; }
  .leyenda { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center; }
  .leyenda div { background: var(--suave); border-radius: 10px; padding: 8px 2px; font-size: 12px; line-height: 1.25; }
  .leyenda b { display: block; font-size: 26px; line-height: 1.2; }
  .nota-p { font-size: 14px; color: var(--texto); line-height: 1.4; margin: 0; }

  label.campo { font-size: 14px; color: var(--gris); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  select, input[type=text], textarea { font-size: 16px; color: var(--azul); background: #fff; border: 1.5px solid var(--linea); border-radius: 10px; padding: 11px 12px; width: 100%; min-width: 0; }
  textarea { min-height: 76px; resize: vertical; line-height: 1.4; }
  .fila { display: flex; gap: 10px; }

  .campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }

  .chip { align-self: flex-start; font-size: 13px; font-weight: 700; color: var(--blanco); background: var(--teal); padding: 3px 10px; border-radius: 12px; }
  .pregunta { font-size: 18px; line-height: 1.4; margin: 0; font-weight: 700; }

  .escala { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .escala button, .na, .opc {

    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 4px; min-height: 60px;
  }
  .escala button .e { font-size: 26px; line-height: 1; }
  .escala button .n { font-size: 14px; font-weight: 700; }

  .tog[aria-pressed="true"] { background: var(--azul); border-color: var(--azul); color: #fff; }

  .btn-link { background: none; border: 0; color: var(--teal); font-size: 15px; font-weight: 700; padding: 6px 0; cursor: pointer; align-self: flex-start; }

  .consejo { background: var(--suave); border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.45; }
  .consejo b { color: var(--teal); }

  .resumen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .resumen div { background: var(--suave); border-radius: 12px; padding: 12px; text-align: center; font-size: 14px; }
  .resumen b { display: block; font-size: 28px; color: var(--teal); }

  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--blanco); box-shadow: 0 -4px 16px rgba(0,0,0,.15);
         padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; align-items: center; justify-content: center; }
  .nav .dentro { width: 100%; max-width: 1120px; display: flex; gap: 10px; align-items: center; }
  .btn { border: 0; border-radius: 12px; padding: 14px 18px; font-size: 17px; font-weight: 700; cursor: pointer; }
  .btn.prim { flex: 2; background: var(--azul); color: #fff; }

  .btn:disabled { opacity: .5; cursor: default; }
  .estado { flex: 2; font-size: 14px; color: var(--gris); }
  .gracias { text-align: center; align-items: center; padding: 28px 18px; }
  .gracias .grande { font-size: 56px; }

  /* Vista mesa */
  .barra-mesa { position: sticky; top: 0; z-index: 5; background: var(--azul); color: #fff; padding: 10px 16px; }
  .barra-mesa .dentro { max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
  .barra-mesa .tit { font-size: 15px; } .barra-mesa .tit b { color: var(--verde); }
  .barra-mesa select { width: auto; padding: 8px 10px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; max-width: 1120px; margin: 10px auto 0; }
  .tabs button { flex: none; border: 0; border-radius: 10px; padding: 9px 14px; font-size: 15px; background: rgba(255,255,255,.12); color: #fff; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--verde); color: var(--azul); font-weight: 700; }
  .cab-preg { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .cab-preg .rk { font-size: 13px; color: var(--gris); }
  .compacta { font-size: 15px; color: var(--texto); background: var(--crema); border-radius: 10px; padding: 10px 12px; }

  /* Resultados (proyector) */
  body.res { background: #F7FAF9; }
  body.res .logos { padding: 14px 40px; gap: 40px; } body.res .logos img { height: 64px; } body.res .logos img.clio { height: 50px; margin-right: auto; }
  .res-cab { background: linear-gradient(90deg, var(--azul), var(--teal)); color: #fff; padding: 22px 40px; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
  .res-cab .eyebrow { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--verde); }
  .res-cab h1 { font-size: 32px; margin: 6px 0 0; }
  .res-cab .tabs { margin: 12px 0 0; }
  .contador { text-align: right; } .contador b { display: block; font-size: 48px; color: var(--verde); line-height: 1; } .contador span { font-size: 15px; color: #D7E6EA; }
  .objetivo { max-width: 1440px; margin: 18px auto 0; padding: 0 40px; }
  .objetivo div { background: var(--azul); color: #fff; border-radius: 14px; padding: 14px 20px; font-size: 18px; line-height: 1.4; }
  .objetivo b { color: var(--verde); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; display: block; margin-bottom: 4px; }
  .res-main { max-width: 1440px; margin: 0 auto; padding: 20px 40px 40px; display: grid; grid-template-columns: 2fr 1fr; gap: 32px; }
  .col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .col h2 { font-size: 16px; text-transform: uppercase; letter-spacing: .06em; color: var(--teal); margin: 8px 0 6px; }
  .item { display: grid; grid-template-columns: 44px 1fr 140px; gap: 14px; align-items: center; padding: 10px 14px; border-radius: 12px; background: #fff; box-shadow: 0 2px 8px rgba(30,47,66,.06); }
  .item.pasa { background: var(--suave); }
  .item .pos { font-size: 22px; font-weight: 700; color: var(--teal); text-align: center; }
  .item .txt { font-size: 17px; line-height: 1.3; min-width: 0; }
  .item .meta { font-size: 13px; color: var(--gris); margin-top: 4px; }
  .item .mesa { display: inline-block; font-size: 12px; font-weight: 700; background: var(--azul); color: #fff; border-radius: 8px; padding: 1px 8px; margin-right: 6px; }
  .item .barra { height: 10px; background: var(--linea); border-radius: 5px; overflow: hidden; }
  .item .barra i { display: block; height: 100%; background: var(--teal); transition: width .4s ease; }
  .item .pts { font-size: 22px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .corte { font-size: 14px; color: var(--magenta); border-top: 2px dashed var(--magenta); padding-top: 6px; margin: 6px 0; }
  .nota { background: #fff; border-radius: 12px; padding: 12px 14px; font-size: 16px; line-height: 1.35; box-shadow: 0 2px 8px rgba(30,47,66,.06); }
  .nota small { display: block; color: var(--gris); font-size: 13px; margin-top: 4px; }
  .vacio { color: var(--gris); font-size: 16px; }
  .matriz-wrap { max-width: 1440px; margin: 0 auto; padding: 20px 40px 40px; display: flex; flex-direction: column; gap: 14px; }
  .conteos { display: flex; flex-wrap: wrap; gap: 10px; }
  .conteos div { background: #fff; border-radius: 12px; padding: 10px 16px; font-size: 15px; box-shadow: 0 2px 8px rgba(30,47,66,.06); }
  .conteos b { font-size: 24px; margin-right: 6px; }
  .tabla { overflow-x: auto; background: #fff; border-radius: 14px; box-shadow: 0 2px 8px rgba(30,47,66,.06); }
  table { border-collapse: collapse; width: 100%; min-width: 980px; font-size: 14px; line-height: 1.35; }
  th { text-align: left; background: var(--azul); color: #fff; padding: 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; position: sticky; top: 0; }
  td { padding: 10px; border-bottom: 1px solid var(--linea); vertical-align: top; }
  td small { display: block; color: var(--gris); }
  @media (max-width: 900px) {
    .res-main { grid-template-columns: 1fr; padding: 16px; } .res-cab, .objetivo, .matriz-wrap { padding-left: 16px; padding-right: 16px; }
    .item { grid-template-columns: 34px 1fr 80px; } body.res .logos { padding: 10px 16px; } body.res .logos img { height: 44px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  /* v6 */
  .menu { display: flex; flex-direction: column; gap: 12px; }
  .menu button, .menu a { display: flex; gap: 14px; align-items: center; text-align: left; border: 0; border-radius: 16px; background: #fff; padding: 16px 18px; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.12); color: var(--azul); text-decoration: none; }
  .menu .num { flex: none; width: 52px; height: 52px; border-radius: 14px; background: var(--azul); color: var(--verde); font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .menu b { display: block; font-size: 18px; } .menu span.sub { font-size: 14px; color: var(--texto); }
  .menu .hecho { margin-left: auto; font-size: 22px; }
  .menu a.proy { background: rgba(255,255,255,.12); color: #fff; box-shadow: none; } .menu a.proy .num { background: rgba(255,255,255,.18); } .menu a.proy span.sub { color: #D7E6EA; }
  .dim { border: 1.5px solid var(--linea); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; background: #fff; }
  .dim[data-on="true"] { border-color: var(--teal); background: var(--suave); }
  .dim .fila-d { display: flex; gap: 10px; align-items: center; font-weight: 700; font-size: 16px; border: 0; background: none; padding: 4px 0; text-align: left; color: var(--azul); cursor: pointer; width: 100%; }
  .dim .marca { margin-left: auto; flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--linea); display: flex; align-items: center; justify-content: center; font-size: 15px; color: #fff; }
  .dim[data-on="true"] .marca { background: var(--teal); border-color: var(--teal); }
  .dim .ej { font-size: 14px; color: var(--texto); }
  .sub-t { font-size: 14px; font-weight: 700; color: var(--azul); margin: 2px 0 0; }
  .idea { border-left: 4px solid var(--teal); background: var(--crema); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 1.4; }
  .idea small { color: var(--gris); font-size: 13px; }
  .mias { display: flex; flex-direction: column; gap: 8px; }
  .mia { background: var(--suave); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
  .mia small { display: block; color: var(--gris); font-size: 13px; margin-top: 4px; }
  .voto { display: grid; grid-template-columns: 1fr 56px; gap: 10px; align-items: start; background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 4px 12px rgba(0,0,0,.10); }
  .voto .qt { margin: 0 0 8px; font-size: 16px; font-weight: 700; line-height: 1.35; }
  .ficha { display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; font-size: 14px; line-height: 1.35; margin: 0; }
  .ficha dt { color: var(--gris); white-space: nowrap; } .ficha dd { margin: 0; color: var(--azul); min-width: 0; }
  .ficha dd.nd { color: var(--gris); font-style: italic; }
  .estrella { width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid var(--linea); background: #fff; font-size: 26px; cursor: pointer; filter: grayscale(1); opacity: .6; }
  .estrella[aria-pressed="true"] { filter: none; opacity: 1; border-color: var(--amarillo); background: #FFF7DD; }
  .grupo-t { color: #fff; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; margin: 8px 2px 0; }
  .barra-pq { display: grid; grid-template-columns: 280px 1fr 50px; gap: 10px 14px; align-items: center; background: #fff; border-radius: 12px; padding: 12px 16px; box-shadow: 0 2px 8px rgba(30,47,66,.06); }
  .barra-pq.activa { background: var(--suave); outline: 2px solid var(--teal); }
  .barra-pq .nom { font-size: 17px; font-weight: 700; } .barra-pq .ejs, .barra-pq .act { grid-column: 1 / -1; font-size: 14px; color: var(--gris); }
  .barra-pq .act b { color: var(--azul); font-weight: 400; }
  .barra-pq .b { height: 12px; background: var(--linea); border-radius: 6px; overflow: hidden; } .barra-pq .b i { display: block; height: 100%; background: var(--teal); }
  .barra-pq .n { font-size: 22px; font-weight: 700; text-align: right; }

  .fac select { width: auto; }
  .chip-dim { display: inline-block; font-size: 12px; background: var(--suave); color: var(--teal); border-radius: 8px; padding: 1px 8px; margin: 2px 4px 0 0; }
  .btn-mini { border: 1.5px solid var(--linea); background: #fff; border-radius: 8px; padding: 5px 10px; font-size: 13px; cursor: pointer; color: var(--azul); }
  .btn-mini.on { background: var(--azul); border-color: var(--azul); color: #fff; }
  .insumos { display: flex; flex-direction: column; gap: 8px; }
  .insumo { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; align-items: start; background: var(--crema); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
  .insumo small { display: block; color: var(--gris); font-size: 13px; } .insumo .com { color: var(--texto); font-size: 14px; margin-top: 2px; }

  .badge.si { background: #0E7A3E; color: #fff; } .badge.parcial { background: var(--amarillo); color: var(--azul); } .badge.no { background: #B0003E; color: #fff; }
  .form-ins { display: flex; flex-direction: column; gap: 10px; border: 2px dashed var(--teal); border-radius: 12px; padding: 12px; }
  .concl { display: flex; flex-direction: column; gap: 10px; background: var(--suave); border-radius: 12px; padding: 12px; }
  .ok-txt { font-size: 13px; color: var(--teal); min-height: 1em; }
  .prio { display: inline-block; font-size: 12px; font-weight: 700; background: var(--verde); color: var(--azul); border-radius: 8px; padding: 1px 8px; margin-right: 6px; }
  .enlace { font-size: 15px; color: #D7E6EA; } .enlace b { color: #fff; }
  .ml th:first-child, .ml td:first-child { width: 16%; } .ml td ul { margin: 0; padding-left: 18px; } .ml td li { margin-bottom: 4px; }
  .fin { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }

  @media (max-width: 900px) { .barra-pq { grid-template-columns: 1fr 50px; } .barra-pq .b { grid-column: 1 / -1; grid-row: 2; } .insumo { grid-template-columns: 1fr auto; } .insumo .badge { grid-column: 1 / -1; justify-self: start; } }
  @media print { .res-cab .tabs, #bFac, .fac, .logos { display: none !important; } body.res { background: #fff; } }
</style>

<script>

          ['✅ Logrables', evs.filter(v => v.lograble === 'Sí').length], ['🛠️ Con ajustes', evs.filter(v => v.lograble === 'Con ajustes').length], ['🚀 Prioritarias', evs.filter(v => v.horizonte === 'Prioritaria').length], ['🗓️ Para más adelante', evs.filter(v => v.horizonte === 'Para más adelante').length]]
          .map(([t, n]) => el('div', {}, [el('b', { text: String(n) }), t]))));
        if (!PQ.length) wrap.appendChild(el('p', { class: 'vacio', text: 'Aún no hay preguntas priorizadas.' }));
        PQ.forEach((q, i) => {
          const v = d.evaluacion[q.id] || {};
          const lista = d.insumos.filter(x => x.pregunta === q.id);
          wrap.appendChild(el('div', { class: 'nota' }, [el('div', { class: 'cab-preg' }, [el('span', { class: 'chip', text: q.id }), el('b', { text: q.texto })]),
            el('div', { class: 'insumos', style: 'margin-top:8px' }, lista.length ? lista.map(x => el('div', { class: 'insumo', style: 'grid-template-columns:92px 1fr' }, [badge(x.tenemos), el('div', {}, [el('b', { text: x.fuente }), el('small', { text: [x.produce, x.frecuencia ? 'dato ' + x.frecuencia.toLowerCase() : ''].filter(Boolean).join(' · ') }), x.comentario ? el('div', { class: 'com', text: '💬 ' + x.comentario }) : null])])) : [el('small', { text: 'Sin insumos todavía.' })]),
            el('small', { style: 'margin-top:8px;font-size:15px;color:#1E2F42', text: ['¿Lograble? ' + (v.lograble || '—'), v.horizonte || '', v.falta ? 'Falta: ' + v.falta : ''].filter(Boolean).join(' · ') })]));
        });
      }
      if (tab === '4') {
        contador.firstChild.textContent = PQ.filter(q => (d.evaluacion[q.id] || {}).presenta).length; contador.lastChild.textContent = 'de ' + PQ.length + ' con presentación';
        if (!PQ.length) wrap.appendChild(el('p', { class: 'vacio', text: 'Aún no hay preguntas priorizadas.' }));
        PQ.forEach(q => { const v = d.evaluacion[q.id] || {};
          wrap.appendChild(el('div', { class: 'nota' }, [el('div', { class: 'cab-preg' }, [el('span', { class: 'chip', text: q.id }), el('b', { text: q.texto })]),
            el('p', { style: 'margin:8px 0 0;font-size:17px', text: '🖼️ ' + (v.presenta || 'Por definir') }),
            el('small', { style: 'font-size:15px', text: ['👤 ' + (v.responsable || 'Responsable por definir'), q.frecuencia ? '🔁 ' + q.frecuencia : '', q.destinos.length ? '📣 ' + q.destinos.join(', ') : ''].filter(Boolean).join(' · ') })])); });
      }
      if (tab === '5') {
        contador.firstChild.textContent = PQ.length; contador.lastChild.textContent = 'preguntas en el marco';
        const act = d.activas || [];
        wrap.appendChild(el('div', { class: 'consejo' }, [el('b', { text: 'Borrador construido en el taller. ' }), 'Resume lo elaborado en los cuatro momentos; se valida y completa en el diagnóstico.']));
        wrap.appendChild(el('h2', { style: 'margin:4px 0 0;font-size:16px;color:#00718A;text-transform:uppercase;letter-spacing:.06em', text: 'Fin · para qué necesitamos la información' }));
        wrap.appendChild(el('div', { class: 'fin' }, (act.length ? act : ['Por acordar']).map(n => el('div', {}, [n, el('small', { text: (() => { const s = []; PQ.filter(q => q.dims.indexOf(n) >= 0).forEach(q => q.destinos.forEach(a => { if (s.indexOf(a) < 0) s.push(a); })); return s.length ? '📣 ' + s.join(' · ') : ''; })() })]))));
        const lis = arr => arr.length ? el('ul', {}, arr.map(t => el('li', { text: t }))) : el('span', { text: '—' });
        const filas = PQ.map(q => { const v = d.evaluacion[q.id] || {}; const ins = d.insumos.filter(x => x.pregunta === q.id);
          return el('tr', {}, [
            el('td', {}, [q.dims.join(' · ')]),
            el('td', {}, [el('b', { text: q.texto }), el('small', { text: [q.mide ? 'Mide: ' + q.mide : '', q.frecuencia, q.destinos.length ? 'A: ' + q.destinos.join(', ') : '', q.decision ? 'Decisión: ' + q.decision : ''].filter(Boolean).join(' · ') })]),
            el('td', {}, [lis(ins.map(x => (x.tenemos === 'Sí' ? '🟢 ' : x.tenemos === 'Parcial' ? '🟡 ' : x.tenemos === 'No' ? '🔴 ' : '❔ ') + x.fuente + (x.produce ? ' (' + x.produce + ')' : '')))]),
            el('td', {}, [[v.lograble ? 'Lograble: ' + v.lograble : '', v.horizonte].filter(Boolean).join(' · ') || '—', el('small', { text: v.falta ? 'Falta: ' + v.falta : '' })]),
            el('td', {}, [v.presenta || '—', el('small', { text: v.responsable ? 'Responsable: ' + v.responsable : '' })])]); });
        wrap.appendChild(PQ.length ? el('div', { class: 'tabla' }, [el('table', { class: 'ml' }, [el('thead', {}, [el('tr', {}, ['Fin (para qué)', 'Propósito · pregunta e indicador', 'Medios de verificación · insumos', 'Supuestos y factibilidad', 'Componente · cómo se ve y responsable'].map(h => el('th', { text: h })))]), el('tbody', {}, filas)])])
          : el('p', { class: 'vacio', text: 'Aparece cuando haya preguntas priorizadas.' }));
        const bImp = el('button', { type: 'button', class: 'btn-mini', style: 'align-self:flex-start', text: '🖨️ Imprimir o guardar en PDF' }); bImp.addEventListener('click', () => window.print());
        wrap.appendChild(bImp);
      }
      cuerpo.replaceChildren(wrap);
    }
    const cargar = () => llamar('obtenerResultados', undefined, d => { if (!(fac && document.activeElement && ['dim-nueva', 'actor-nuevo'].indexOf(document.activeElement.id) >= 0)) pintar(d); else ultimo = d; });
    pintarTabs(); cargar(); setInterval(cargar, 8000);
  }

  function iniciar() {
    app.replaceChildren(el('main', {}, [el('div', { class: 'tarjeta', text: 'Cargando…' })]));
    const ini = { mesa: 'tenemos', tenemos: 'tenemos', comose: 'comose', paraque: 'paraque', preguntas: 'preguntas', votar: 'votar' };
    const arrancar = vista => llamar('obtenerConfig', undefined, cfg => { CFG = cfg; if (vista === 'resultados') resultados(); else participante(ini[vista] || 'inicio'); },
      e => app.replaceChildren(el('main', {}, [el('div', { class: 'tarjeta error', text: 'No se pudo cargar: ' + (e && e.message ? e.message : 'recargue la página') + '.' })])));
    if (EN_APPS_SCRIPT) google.script.url.getLocation(loc => arrancar(loc && loc.parameter ? loc.parameter.vista : ''));
    else arrancar(new URLSearchParams(location.search).get('vista') || (['#resultados', '#preguntas', '#tenemos', '#comose', '#marco'].indexOf(location.hash) >= 0 ? 'resultados' : ''));
  }
  iniciar();
</script>
</body>
